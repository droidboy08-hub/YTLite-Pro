name: Create YouTube Plus app

on:
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        description: "Integrate YTUHD"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

      build_on_linux:
        description: "Build on Linux instead of macOS (faster, and not affected by shortages of Mac runners)"
        type: boolean
        required: true
        default: false

      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      info_note:
        description: "TIP: Learn more about integrations in the README via the link below"
        default: "https://github.com/droidboy08-hub/YTLite-Pro#tweak-integration"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      enable_localization: false
      build_from_source: true
      linux: ${{ inputs.build_on_linux }}

  package:
    name: Package IPA
    runs-on: ${{ inputs.build_on_linux && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 45
    needs: build-tweaks
    permissions:
      contents: write
    env:
      APP_VERSION: ytlite-source

    steps:
      - name: Download built debs
        uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,enable_demc,enable_ryd,enable_ytabc,enable_youpip,enable_yq,enable_ytuhd,build_on_linux,info_note

      - name: Download and validate IPA
        run: |
          wget "${{ github.event.inputs.ipa_url }}" --no-verbose -O youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Patch Info.plist
        env:
          FILE_SHARING: "true"
        run: |
          unzip -q youtube.ipa -d ipa_tmp
          plist="$(find ipa_tmp/Payload -maxdepth 1 -name '*.app' | head -n 1)/Info.plist"
          # Python's plistlib instead of PlistBuddy, so this also runs on Linux.
          python3 - "$plist" <<'EOF'
          import os, plistlib, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              data = f.read()
          fmt = plistlib.FMT_BINARY if data.startswith(b"bplist") else plistlib.FMT_XML
          info = plistlib.loads(data)
          info.pop("UIDesignRequiresCompatibility", None)
          info["NSFaceIDUsageDescription"] = "Face ID is required to authenticate."
          if os.environ["FILE_SHARING"] == "true":
              # Show the app's Documents folder (downloaded videos) in the Files app.
              info["UIFileSharingEnabled"] = True
              info["LSSupportsOpeningDocumentsInPlace"] = True
          with open(path, "wb") as f:
              plistlib.dump(info, f, fmt=fmt)
          EOF
          rm youtube.ipa
          (cd ipa_tmp && zip -qry ../youtube.ipa .)
          rm -rf ipa_tmp

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject tweaks into IPA
        run: |
          tweaks="ytplus.deb OpenYouTubeSafariExtension.appex"
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i youtube.ipa -o "YouTubePlus_${APP_VERSION}.ipa" -uwef $tweaks -n "${{ github.event.inputs.display_name }}" -b ${{ github.event.inputs.bundle_id }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ytp-${{ github.run_number }}
          name: YouTubePlus v${{ env.APP_VERSION }} (${{ github.run_number }})
          files: YouTubePlus_${{ env.APP_VERSION }}.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
